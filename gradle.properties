# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Let Gradle evaluate independent projects in parallel while the configuration
# cache is being built. On a two-module build this overlaps the :app and root
# configuration instead of running them back to back.
org.gradle.configuration-cache.parallel=true
# Report configuration-cache problems as warnings rather than hard failures, so an
# unrelated plugin cannot block a release build.
org.gradle.configuration-cache.problems=warn
# Let Gradle use every core. The previous cap of 4 workers was the single biggest
# cause of slow builds, because Kotlin, R8 and resource processing all sat idle
# waiting on a slot while the machine had capacity to spare.
org.gradle.workers.max=8
# Reuse the Kotlin compiler daemon between builds. The previous in-process strategy
# sidestepped a connection bug but forked a fresh compiler for every build, which
# cost far more time than it saved.
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true
# Run R8 in full mode: it shrinks more aggressively than the legacy default.
android.enableR8.fullMode=true
# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true

# Local-build versionCode floor. CI overrides it with the run number via
# -PversionCode. This value must be kept at or above the last published build,
# otherwise Android rejects the build as a downgrade instead of an update.
#
# Check update.json (committed by the release job) for the newest published
# version_code and raise this above it before cutting a local build. As of
# v1.0.65 that is build 173 — it was still sitting at 100 (v1.0.41 era), which
# made every locally built APK advertise itself as older than the published
# release and offer an "update" to a build the viewer already had.
kurdishTvVersionCode=173

# Human-facing version shown in Settings -> About. Bump this for each release;
# it is independent of versionCode so a CI run number never shows up in the UI.
# CI auto-increments the patch number past the newest published tag, so this
# local value only affects local and untracked builds.
kurdishTvVersionName=1.0.65
